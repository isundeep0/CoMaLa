[package]
name = "comala"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "comala_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# ── Build profiles ──────────────────────────────────────────────────
# windows v0.61.x with all WinRT/Win32 features creates enormous LLVM IR.
# Setting codegen-units=256 globally splits every crate (including windows)
# into 256 small modules — each one is tiny enough for LLVM to handle.
[profile.release]
codegen-units = 256
opt-level = 2
lto = false            # skip link-time optimization (saves ~5-10 min)
strip = "debuginfo"    # smaller binary, faster link

# Dev profile: fast iteration
[profile.dev]
opt-level = 0
codegen-units = 256
incremental = true

